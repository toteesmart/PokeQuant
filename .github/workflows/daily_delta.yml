name: Daily Delta Pipeline

on:
  schedule:
    - cron: '0 8 * * *' # Runs at 08:00 UTC (4:00 AM EST)
  workflow_dispatch:    # Allows manual triggering from the Actions tab

jobs:
  run-daily-delta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        # lfs: true is intentionally removed to skip downloading the broken pointer

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download Master Database from R2
        run: |
          curl -O https://pub-81d2f5a4ba9a4821bc03f0c3375f9536.r2.dev/mobile_catalog.db
          mv mobile_catalog.db pokemon_tcg.db

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Delta Pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python daily_delta_pipeline.py
