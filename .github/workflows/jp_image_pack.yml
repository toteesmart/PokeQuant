name: Japanese Image Pack

# Manual-only: the ~1.4 GB JP image zip is rebuilt on demand. Runs against the
# shipped mobile_catalog.db so the heavy LFS pokemon_tcg.db is never needed.
on:
  workflow_dispatch:

jobs:
  build-jp-image-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download shipped catalog from R2
        run: |
          curl -O https://pub-81d2f5a4ba9a4821bc03f0c3375f9536.r2.dev/mobile_catalog.db

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests boto3

      - name: Build and upload JP image pack
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python build_jp_images.py --db mobile_catalog.db --upload
