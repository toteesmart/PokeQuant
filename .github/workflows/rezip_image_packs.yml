name: Re-store Image Packs

# Manual-only: rewrites the R2 image zips with uncompressed (stored) entries
# so mobile extraction is a pure file copy. Both packs exceed wrangler's
# 300 MiB cap and the R2 dashboard limit, so upload goes through boto3 with
# the repo's existing R2 secrets.
on:
  workflow_dispatch:
    inputs:
      pack:
        description: 'Which pack to re-store'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - catalog_images.zip
          - catalog_images_jp.zip

jobs:
  rezip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests boto3

      - name: Re-store and upload image pack(s)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ "${{ inputs.pack }}" = "both" ]; then
            python rezip_image_packs.py
          else
            python rezip_image_packs.py "${{ inputs.pack }}"
          fi
