<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <title>PokeQuant</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.css" />
  </head>
  <body style="margin: 0; background: #0e1117;">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => console.log('Offline Engine Ready'));
      }
      stlite.mount({
        requirements: ["pandas", "beautifulsoup4", "pillow"], 
        entrypoint: "app.py",
        files: {
          "app.py": { url: "app.py" },
          "card_tool.py": { url: "card_tool.py" },
          "mobile_catalog.db": { url: "mobile_catalog.db" }
        }
      }, document.getElementById("root"));
    </script>
  </body>
</html>
