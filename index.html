<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <title>PokeQuant</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.css" />
    
    <!-- Sentry Crash & Telemetry Logging -->
    <script src="https://browser.sentry-cdn.com/7.73.0/bundle.min.js" crossorigin="anonymous"></script>
    <script>
      Sentry.init({
        dsn: "https://98e220bf4dc773ffbc857d587e0138d7@o4512001935278080.ingest.us.sentry.io/4512001944322048",
        release: "pokequant-beta-0.9",
        environment: "browser",
        attachStacktrace: true,
        tracesSampleRate: 1.0,
      });

      // Watch for Streamlit red error boxes and uncaught exception UI.
      function initPokeQuantSentryObservers() {
        if (typeof MutationObserver === 'undefined' || typeof Sentry === 'undefined') return;
        const reported = new WeakSet();
        const observer = new MutationObserver((mutations) => {
          for (const m of mutations) {
            if (m.type !== 'childList') continue;
            for (const node of m.addedNodes) {
              if (node.nodeType !== 1) continue;
              const targets = [];
              if (node.matches && node.matches('[data-testid="stException"]')) targets.push(node);
              if (node.querySelectorAll) targets.push(...node.querySelectorAll('[data-testid="stException"]'));

              if (node.matches && node.matches('[data-testid="stAlert"]') && node.querySelector('[data-testid="stAlertContentError"]')) {
                targets.push(node);
              }
              if (node.querySelectorAll) {
                for (const el of node.querySelectorAll('[data-testid="stAlert"]')) {
                  if (el.querySelector('[data-testid="stAlertContentError"]')) targets.push(el);
                }
              }

              for (const el of targets) {
                if (reported.has(el)) continue;
                reported.add(el);
                const msg = (el.textContent || '').trim().substring(0, 500);
                if (msg) {
                  Sentry.captureMessage('PokeQuant UI Error Box: ' + msg, { level: 'error', extra: { source: 'ui-observer' } });
                }
              }
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initPokeQuantSentryObservers);
      } else {
        initPokeQuantSentryObservers();
      }

      // Listen for service worker error reports.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'PQ_SW_ERROR' && typeof Sentry !== 'undefined') {
            Sentry.captureMessage(event.data.message, { level: 'error', extra: event.data.extra || {} });
          }
        });
      }
    </script>
    
    <style>
      body { margin: 0; background: #0e1117; color: #fff; font-family: sans-serif; }
      #loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; }
      .progress-bar-container { width: 80%; max-width: 300px; background: #333; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 15px; }
      .progress-bar { width: 0%; height: 100%; background: #ef4444; transition: width 0.2s; }
      #error-log { color: #ff6b6b; font-family: monospace; margin-top: 20px; font-size: 14px; text-align: left; max-width: 90%; word-wrap: break-word; }
    </style>
  </head>
  <body>
    <div id="loader">
      <h3 id="main-title">Booting Python Engine...</h3>
      <div id="status">Connecting to CDN...</div>
      <div class="progress-bar-container" id="pb-container" style="display:none;">
        <div id="pbar" class="progress-bar"></div>
      </div>
      <div id="error-log"></div>
    </div>
    <div id="root" style="display:none;"></div>

    <script type="module">
      window.onerror = function(msg, url, line, col, error) {
         document.getElementById('error-log').innerHTML += `<br><b>Error:</b> ${msg}`;
         if (typeof Sentry !== 'undefined') Sentry.captureException(error || new Error(msg));
      };
      
      window.addEventListener('unhandledrejection', function(event) {
         document.getElementById('error-log').innerHTML += `<br><b>Promise Error:</b> ${event.reason}`;
         if (typeof Sentry !== 'undefined') Sentry.captureException(event.reason);
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }

      const DB_CHUNK_SIZE = 10 * 1024 * 1024; 
      const DB_NAME = 'PokeQuantDB';
      const STORE_NAME = 'chunks';

      function initDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, 1);
          request.onupgradeneeded = (e) => {
            e.target.result.createObjectStore(STORE_NAME);
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      function saveChunk(db, key, data) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(data, key);
          tx.oncomplete = resolve;
          tx.onerror = reject;
        });
      }

      function getFromDB(db, key) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      function saveToDB(db, key, data) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(data, key);
          tx.oncomplete = resolve;
          tx.onerror = reject;
        });
      }

      function getWorkerEndpoint(url) {
        if (!url) return null;
        let u = String(url).replace('libsql://', 'https://').trim();
        if (!u.startsWith('http')) u = 'https://' + u;
        u = u.replace(/\/$/, '');
        if (u.includes('.workers.dev')) return u;
        return u + '/v2/pipeline';
      }

      function parseRemoteSyncTime(data) {
        if (!data || !data.results || data.results.length < 2) return 0;
        const second = data.results[1];
        if (!second || second.type !== 'ok' || !second.response || !second.response.result) return 0;
        const rows = second.response.result.rows;
        if (!rows || !rows.length || !rows[0] || !rows[0].length) return 0;
        const cell = rows[0][0];
        if (!cell || cell.value === undefined || cell.value === null) return 0;
        const v = parseFloat(cell.value);
        return isNaN(v) ? 0 : v;
      }

      async function startRemoteSyncPoller() {
        try {
          const db = await initDB();
          const DEFAULT_WORKER = "https://pokequant-gateway.totees-mart.workers.dev";

          const poll = async () => {
            try {
              const betaKey = await getFromDB(db, 'pokequant_beta_key');
              if (!betaKey) return;

              let url = await getFromDB(db, 'turso_url');
              const token = await getFromDB(db, 'turso_token') || "";
              if (!url) url = DEFAULT_WORKER;

              const endpoint = getWorkerEndpoint(url);
              if (!endpoint) return;

              const payload = {
                requests: [
                  {type: "execute", stmt: {sql: "CREATE TABLE IF NOT EXISTS sync_metadata (id INTEGER PRIMARY KEY, last_updated REAL)", args: []}},
                  {type: "execute", stmt: {sql: "SELECT last_updated FROM sync_metadata WHERE id = 1", args: []}},
                  {type: "close"}
                ]
              };
              const headers = {"Content-Type": "application/json", "X-Beta-Key": String(betaKey)};
              if (token) headers["Authorization"] = "Bearer " + String(token);

              const res = await fetch(endpoint, {method: "POST", headers, body: JSON.stringify(payload)});
              if (!res.ok) return;
              const data = await res.json();
              const remoteTime = parseRemoteSyncTime(data);
              await saveToDB(db, '__pq_remote_sync_time', {time: remoteTime, ts: Date.now() / 1000});
            } catch (e) {
              console.warn('Remote sync poll failed', e);
            }
          };

          setInterval(poll, 60000);
          setTimeout(poll, 15000);
        } catch (e) {
          console.warn('Could not start remote sync poller', e);
        }
      }

      function checkExistingDatabase(db) {
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get('metadata');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      }

      async function downloadAndChunkDatabase(url) {
        const db = await initDB();
        
        const metadata = await checkExistingDatabase(db);
        if (metadata && metadata.totalChunks > 0) {
           document.getElementById('pbar').style.width = '100%';
           document.getElementById('status').innerText = 'Database loaded from local storage!';
           return;
        }

        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const contentLength = +response.headers.get('Content-Length') || 397400000; 
        const reader = response.body.getReader();
        
        let chunkIndex = 0;
        let buffer = new Uint8Array(0);
        let receivedLength = 0;

        while (true) {
          const { done, value } = await reader.read();
          if (done) {
            if (buffer.length > 0) await saveChunk(db, chunkIndex++, buffer);
            break;
          }

          let newBuffer = new Uint8Array(buffer.length + value.length);
          newBuffer.set(buffer);
          newBuffer.set(value, buffer.length);
          buffer = newBuffer;
          
          receivedLength += value.length;
          const pct = Math.round((receivedLength / contentLength) * 100);
          document.getElementById('pbar').style.width = pct + '%';
          document.getElementById('status').innerText = `${Math.round(receivedLength / (1024*1024))} MB / ${Math.round(contentLength / (1024*1024))} MB (${pct}%)`;

          while (buffer.length >= DB_CHUNK_SIZE) {
            await saveChunk(db, chunkIndex++, buffer.slice(0, DB_CHUNK_SIZE));
            buffer = buffer.slice(DB_CHUNK_SIZE);
          }
        }
        
        await saveChunk(db, 'metadata', { totalChunks: chunkIndex });
      }

      async function startApp() {
        try {
          document.getElementById('main-title').innerText = 'Booting Python Engine...';
          document.getElementById('status').innerText = 'Downloading stlite module...';
          
          let stliteMount;
          try {
              const stlite = await import('https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.js');
              stliteMount = stlite.mount;
          } catch (e) {
              const stlite = await import('https://unpkg.com/@stlite/browser@0.76.0/build/stlite.js');
              stliteMount = stlite.mount;
          }

          document.getElementById('main-title').innerText = 'Loading Offline Database...';
          document.getElementById('status').innerText = 'Starting database stream...';
          document.getElementById('pb-container').style.display = 'block';
          
          await downloadAndChunkDatabase('https://pub-81d2f5a4ba9a4821bc03f0c3375f9536.r2.dev/mobile_catalog.db');

          document.getElementById('pb-container').style.display = 'none';
          document.getElementById('main-title').innerText = 'Mounting UI...';
          document.getElementById('status').innerText = 'Extracting Pyodide. This takes 10-20 seconds...';

          stliteMount({
            requirements: ["pandas", "beautifulsoup4", "pillow", "sqlite3"],
            entrypoint: "app.py",
            files: {
              "app.py": { url: "app.py" },
              "card_tool.py": { url: "card_tool.py" },
              "mobile_catalog.db": { url: "/offline-db/mobile_catalog.db" },
              ".streamlit/secrets.toml": `
TURSO_DATABASE_URL = "https://pokequant-gateway.totees-mart.workers.dev"
`
            }
          }, document.getElementById("root"));

          setTimeout(() => {
              document.getElementById('loader').style.display = 'none';
              document.getElementById('root').style.display = 'block';
          }, 4500);

          // Start a background JS poller so the sidebar sync status can update
          // without the Pyodide worker blocking on a synchronous XHR.
          startRemoteSyncPoller();

        } catch (err) {
          document.getElementById('error-log').innerHTML += `<br><b>Load Error:</b> ${err}`;
          if (typeof Sentry !== 'undefined') Sentry.captureException(err);
        }
      }
      
      startApp();
    </script>
  </body>
</html>
