appId: com.toteesmart.PokeQuantMobile
---
# Open the Shows tab. A populated list, an empty state, or a loading state are
# all acceptable - the screenshot records whatever rendered.
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-shows"
    timeout: 90000
- assertVisible:
    id: "tab-shows"
- tapOn:
    id: "tab-shows"
- extendedWaitUntil:
    visible:
      text: "(?i).*(upcoming|no shows|loading|download).*"
    timeout: 20000
    optional: true
    label: "Wait for show list, empty, or loading state"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: shows-list
