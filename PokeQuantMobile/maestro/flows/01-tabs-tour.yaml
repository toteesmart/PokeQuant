appId: com.toteesmart.PokeQuantMobile
---
# Tour the four bottom tabs and return to Inventory.
# Tab names match tabBarLabel strings exactly. Settings is intentionally not a
# tab - see 06-settings-gear.yaml.
- launchApp
- extendedWaitUntil:
    visible: 'Inventory'
    timeout: 90000
- assertVisible: 'Inventory'
- takeScreenshot: inventory
# 'Inventory' resolves against the floating tab bar: the label renders as a
# Text child inside the tab Pressable AND as its contentDescription. Taps go
# through tabBarButtonTestID instead - stable ids don't drift with labels.
- tapOn:
    id: 'tab-scan'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: scan
- tapOn:
    id: 'tab-search'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: search
- tapOn:
    id: 'tab-shows'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: shows
- tapOn:
    id: 'tab-inventory'
- waitForAnimationToEnd:
    timeout: 3000
