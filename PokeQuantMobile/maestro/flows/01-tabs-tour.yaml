appId: com.toteesmart.PokeQuantMobile
---
# Tour the four bottom tabs and return to Inventory.
# Tab names match tabBarLabel strings exactly. Settings is intentionally not a
# tab - see 06-settings-gear.yaml.
- launchApp
- extendedWaitUntil:
    visible: 'Inventory'
    timeout: 90000
- assertVisible: 'Inventory'
- takeScreenshot: inventory
# Tab labels render inside each tab button's contentDescription (as "?, Scan"
# etc.), so text matching cannot see them - tap the tabBarButtonTestID instead.
- tapOn:
    id: 'tab-scan'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: scan
- tapOn:
    id: 'tab-search'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: search
- tapOn:
    id: 'tab-shows'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: shows
- tapOn:
    id: 'tab-inventory'
- waitForAnimationToEnd:
    timeout: 3000
