appId: com.toteesmart.PokeQuantMobile
---
# Open the Scan tab. Camera preview, permission prompt, scan meter, or a
# model-download gate are all acceptable outcomes. The flow only fails on a
# crash or timeout - never on which surface rendered.
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-scan"
    timeout: 90000
- assertVisible:
    id: "tab-scan"
- tapOn:
    id: "tab-scan"
- extendedWaitUntil:
    visible:
      text: "(?i).*(camera|permission|allow|scans left|trial|download|limit).*"
    timeout: 20000
    optional: true
    label: "Wait for any scan-tab surface (optional)"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: scan-tab
